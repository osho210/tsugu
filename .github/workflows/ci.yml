name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          cache: pnpm

      - name: TODO check
        run: pnpm check:todo

      - name: Secret scan
        run: pnpm check:secrets

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency vulnerability audit
        run: pnpm security:audit

      - name: Development dependency vulnerability audit
        run: pnpm security:audit:dev
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture

      - name: Migration safety check
        run: pnpm check:migration
        env:
          BASE_REF: origin/${{ github.base_ref }}
          MIGRATION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'migration-approved') }}

      - name: Dead code
        run: pnpm deadCode

      - name: API typecheck
        run: pnpm --filter api exec tsc --noEmit

      - name: API test
        run: pnpm --filter api test

      - name: API build
        run: pnpm --filter api build

      - name: Web build
        run: pnpm --filter web build
